   text: "چهار سطح Public Internal/Internal/Confidential/Restricted با سیاست دسترسی و اشتراک؛ Retention شامل مدت، آرشیو، حذف، Legal Hold، Restore و Audit. حذف در F1 با Recycle Bin و Restore؛ Hard Delete محدود، مجوزدار و قابل Audit.",
   modules: [Files], tests: [T-FILE-027, T-FILE-030], status: in-analysis, phase: "F1", source_section: "MASTER ADDENDUM §15", source_lines: "15"}

