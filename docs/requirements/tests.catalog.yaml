# =============================================================================
# VIRA CRM — Test Plan / Test Scenarios Catalog (machine readable)
# -----------------------------------------------------------------------------
# الزامات گزارش تست (بخش ۲۳ بریف):
#   Test ID | شرح | پیش‌شرط | مراحل | نتیجه انتظاری | نتیجه واقعی | Pass/Fail/Not Tested | شواهد
#
# وضعیت‌های مجاز (واژگان رسمی):
#   PASS          — اجرا شده، نتیجه مطابق انتظار، شاهد ثبت‌شده
#   FAIL          — اجرا شده، نتیجه مغایر انتظار
#   BLOCKED       — اجرا ممکن نیست به دلیل وابستگی بیرونی؛ دلیل در فیلد blocked_reason
#   NOT_RUN       — اجرا نشده، اما مانع بیرونی هم ندارد (فقط هنوز نوبت/امکانش نبوده)
#   NOT_APPLICABLE— با تصمیم ثبت‌شده در محدوده این پروژه نیست
#   not-tested    — معادل قدیمی NOT_RUN؛ فقط برای سازگاری با رکوردهای موجود
# قانون ۱: هیچ تستی بدون اجرای واقعی + شاهد PASS نمی‌شود.
# قانون ۲: هیچ تستی به صرف «syntax درست است» PASS نمی‌شود.
# قانون ۳: هر BLOCKED باید فیلد blocked_reason و (در صورت وجود) owner_action داشته باشد.
#
# زمینه اجرا (environment): sandbox | staging | host | manual
# =============================================================================

