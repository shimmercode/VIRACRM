# ───────────────────────────────── REQ-01 ─────────────────────────────────
- {id: REQ-01.01, group: REQ-01, type: brief, priority: P0, weight: 5,
   title: "استقلال کامل نرم‌افزار از وردپرس",
   text: "CRM یک Standalone Web Application است؛ نه افزونه وردپرس، نه وابسته به قالب/Elementor، نه وابسته به جدول‌ها و کاربران وردپرس.",
   modules: [Foundation], tests: [T-SEC-09, T-OPS-07, T-OPS-08], status: designed, phase: "معماری", source_section: "۱", source_lines: "9-21"}

- {id: REQ-01.02, group: REQ-01, type: brief, priority: P0, weight: 5,
   title: "دیتابیس مستقل و ساب‌دامین مستقل",
   text: "دیتابیس CRM مستقل از وردپرس؛ ساب‌دامین crm.viraagency.co با Document Root اختصاصی به پوشه public.",
   modules: [Deployment], tests: [T-INF-04], status: designed, phase: "استقرار", source_section: "۱", source_lines: "9-21"}

- {id: REQ-01.03, group: REQ-01, type: brief, priority: P0, weight: 4,
   title: "فایل‌های حساس خارج از Document Root",
   text: "فایل‌های برنامه و داده‌های حساس خارج از مسیر عمومی وب؛ فقط public قابل دسترس. در صورت محدودیت هاست، امن‌ترین معماری سازگار.",
   modules: [Deployment], tests: [T-SEC-10], status: designed, phase: "استقرار", source_section: "۱", source_lines: "9-21"}

- {id: REQ-01.04, group: REQ-01, type: brief, priority: P1, weight: 3,
   title: "تاب‌آوری CRM در قطعی سایت اصلی",
   text: "قطعی/به‌روزرسانی وب‌سایت وردپرسی نباید CRM را مختل کند؛ اتصال آینده فقط از طریق API مستقل.",
   modules: [Foundation], tests: [], status: designed, phase: "معماری", source_section: "۱", source_lines: "9-21"}

